<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvadePlayer — standalone test (local dist)</title>
    <link rel="stylesheet" href="dist/evade-player.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            background: #0f0f0f;
            color: #e5e5e5;
            font-family: system-ui, sans-serif;
            min-height: 100vh;
        }

        h1 { font-size: 1rem; font-weight: 600; margin: 0 0 16px; color: #fff; }

        evade-player {
            display: block;
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            margin: 0 auto 24px;
        }

        .controls {
            max-width: 960px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 14px 16px;
        }

        .card h2 {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #888;
            margin: 0 0 10px;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        button {
            padding: 5px 12px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #222;
            color: #ccc;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: #2e2e2e; }
        button.active { background: #1d4ed8; border-color: #2563eb; color: #fff; }

        #log {
            max-width: 960px;
            margin: 16px auto 0;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 0.75rem;
            font-family: monospace;
            color: #6ee7b7;
            max-height: 160px;
            overflow-y: auto;
        }
        #log p { margin: 2px 0; }

        .src-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .src-row input {
            flex: 1;
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #111;
            color: #ccc;
            font-size: 0.8rem;
            outline: none;
        }
        .src-row input:focus { border-color: #555; }
        .probe-card { grid-column: 1 / -1; }
        #probe { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 14px; }
        .probe-row { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .probe-row span { color: #777; font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; }
        .probe-row b { color: #eee; font-size: .82rem; font-weight: 500; overflow-wrap: anywhere; }
        .probe-row b.ok  { color: #7ee787; }
        .probe-row b.bad { color: #ff7b72; }
    </style>
</head>
<body>

<h1>EvadePlayer — standalone test</h1>

<evade-player id="player" locale="ru"></evade-player>

<div class="controls">

    <div class="card probe-card">
        <h2>Что играет сейчас</h2>
        <dl id="probe"><div class="probe-row"><span>—</span><b>ожидание</b></div></dl>
    </div>

    <div class="card">
        <h2>Источник</h2>
        <div class="row">
            <button onclick="setSrc('hls-big')">Big Buck Bunny</button>
            <button onclick="setSrc('hls-subs')">BipBop (субтитры)</button>
            <button onclick="setSrc('hls-audio')">Angel One (мультиаудио)</button>
            <button onclick="setSrc('mp4')">MP4</button>
        </div>
        <div class="src-row">
            <input id="custom-src" type="url" placeholder="https://example.com/video.m3u8">
            <button onclick="applyCustomSrc()">Применить</button>
        </div>
    </div>

    <div class="card">
        <h2>Качество</h2>
        <div class="row">
            <button onclick="setQualities(true)">Варианты качества</button>
            <button onclick="setQualities(false)">Без вариантов</button>
        </div>
    </div>

    <div class="card">
        <h2>Сезоны / эпизоды</h2>
        <div class="row">
            <button onclick="setSeasons(true)">2 сезона</button>
            <button onclick="setSeasons(false)">Без сезонов</button>
        </div>
    </div>

    <div class="card">
        <h2>Текущий эпизод</h2>
        <div class="row" id="episode-btns"></div>
    </div>

    <div class="card">
        <h2>Озвучка</h2>
        <div class="row" id="voiceover-btns"></div>
    </div>

    <div class="card">
        <h2>Фрагменты</h2>
        <div class="row">
            <button onclick="setFragments(true)">Добавить фрагменты</button>
            <button onclick="setFragments(false)">Без фрагментов</button>
        </div>
    </div>

    <div class="card">
        <h2>Постер</h2>
        <div class="row">
            <button onclick="setPoster(true)">С постером</button>
            <button onclick="setPoster(false)">Без постера</button>
        </div>
    </div>

    <div class="card">
        <h2>Сохранённая позиция</h2>
        <div class="row">
            <button onclick="setSavedState(30)">С 30 сек</button>
            <button onclick="setSavedState(120)">С 2 мин</button>
            <button onclick="setSavedState(null)">Сброс</button>
        </div>
    </div>

    <div class="card">
        <h2>Язык</h2>
        <div class="row">
            <button onclick="setLocale('ru')">RU</button>
            <button onclick="setLocale('en')">EN</button>
        </div>
    </div>

</div>

<div id="log"><p>— события появятся здесь —</p></div>

<script src="dist/evade-player.js"></script>
<script>
const player = document.getElementById('player');
const logEl  = document.getElementById('log');

// ── Data ────────────────────────────────────────────────────────────────────

// ── Источники ────────────────────────────────────────────────────────────────
// Все ссылки проверены разбором манифеста: разрешение, длительность и набор
// дорожек указаны по факту, а не со слов. Подобраны так, чтобы у каждого
// источника был уникальный «отпечаток» — тогда видно, что переключение
// действительно сменило контент, а не осталось на прежнем.
//
// Лицензии: Big Buck Bunny / Tears of Steel / Sintel — Blender Foundation,
// CC-BY; Angel One — тестовый ассет Shaka Player; BipBop — публичный тестовый
// поток Apple; остальное — публичные тестовые потоки Mux.

const CATALOG = {
    bbb: {
        label: 'Big Buck Bunny',
        src:   'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',
        note:  '1920×1080 · 10:34 · MPEG-TS',
        dur: 634,
        subs: 0,
    },
    bbbDark: {
        label: 'Big Buck Bunny — Dark Truths',
        src:   'https://storage.googleapis.com/shaka-demo-assets/bbb-dark-truths-hls/hls.m3u8',
        note:  '1252×720 · 6:12 · тот же фильм, другой монтаж',
        dur: 372,
        subs: 0,
    },
    tos: {
        label: 'Tears of Steel',
        src:   'https://test-streams.mux.dev/tos_ismc/main.m3u8',
        note:  '1920×800 · 12:14 · fMP4',
        dur: 734,
        subs: 2,
    },
    shift: {
        label: 'PTS shift',
        src:   'https://test-streams.mux.dev/pts_shift/master.m3u8',
        note:  '1280×720 · 2:45',
        dur: 165,
        subs: 0,
    },
    bipbop: {
        label: 'Apple BipBop — с субтитрами',
        src:   'https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_16x9/bipbop_16x9_variant.m3u8',
        note:  '1920×1080 · 30:00 · субтитры en/fr/es/ja (+forced) = 8 дорожек',
        dur: 1800,
        subs: 8,
    },
    bipbopPlain: {
        label: 'Apple BipBop — без субтитров',
        src:   'https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/bipbop_4x3_variant.m3u8',
        note:  '4×3 · 30:00 · без дорожек субтитров',
        dur: 1800,
        subs: 0,
    },
    angel: {
        label: 'Angel One',
        src:   'https://storage.googleapis.com/shaka-demo-assets/angel-one-hls/hls.m3u8',
        note:  '768×576 · 1:00 · аудио en/de/it/fr/es',
        dur: 60,
        subs: 4,
    },
    mp4: {
        label: 'MP4 (прогрессивный)',
        src:   'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
        note:  'прогрессивный MP4, без HLS',
        dur: 596,
        subs: 0,
    },
};

const SOURCES = {
    'hls-big': CATALOG.bbb.src,
    'hls-subs': CATALOG.bipbop.src,
    'hls-audio': CATALOG.angel.src,
    'mp4': CATALOG.mp4.src,
};

// Варианты качества — это ренditions Big Buck Bunny, поэтому осмысленны
// только когда играет он.
const QUALITIES = [
    { label: '1080p', src: 'https://test-streams.mux.dev/x36xhzz/url_6/url_462/193039199_mp4_h264_aac_hd_7.m3u8' },
    { label: '720p',  src: 'https://test-streams.mux.dev/x36xhzz/url_2/url_462/193039199_mp4_h264_aac_ld_7.m3u8' },
    { label: '480p',  src: 'https://test-streams.mux.dev/x36xhzz/url_6/193039199_mp4_h264_aac_hd_7.m3u8' },
];

// Каждый эпизод и каждая озвучка ведут на РАЗНЫЙ источник с разной
// длительностью — именно поэтому по панели «Что играет сейчас» видно, что
// переключение сработало.
const SEASONS = [
    {
        label: 'Сезон 1 — открытые фильмы', value: 's1',
        episodes: [
            {
                label: 'Эпизод 1 · Big Buck Bunny', value: 's1e1', src: CATALOG.bbb.src,
                voiceovers: [
                    { label: 'Оригинал (10:34)',    value: 'orig', src: CATALOG.bbb.src },
                    { label: 'Другой монтаж (6:12)', value: 'alt',  src: CATALOG.bbbDark.src },
                ],
            },
            {
                label: 'Эпизод 2 · Tears of Steel', value: 's1e2', src: CATALOG.tos.src,
                voiceovers: [
                    { label: 'Оригинал (12:14)', value: 'orig', src: CATALOG.tos.src },
                ],
            },
            {
                label: 'Эпизод 3 · PTS shift', value: 's1e3', src: CATALOG.shift.src,
                voiceovers: [
                    { label: 'Оригинал (2:45)', value: 'orig', src: CATALOG.shift.src },
                ],
            },
        ],
    },
    {
        label: 'Сезон 2 — дорожки', value: 's2',
        episodes: [
            {
                label: 'Эпизод 1 · BipBop', value: 's2e1', src: CATALOG.bipbop.src,
                voiceovers: [
                    { label: 'С субтитрами (4 языка)', value: 'subs',  src: CATALOG.bipbop.src },
                    { label: 'Без субтитров',          value: 'plain', src: CATALOG.bipbopPlain.src },
                ],
            },
            {
                label: 'Эпизод 2 · Angel One', value: 's2e2', src: CATALOG.angel.src,
                voiceovers: [
                    { label: 'Мультиаудио (5 языков)', value: 'multi', src: CATALOG.angel.src },
                ],
            },
        ],
    },
];

const FRAGMENTS = [
    { type: 'opening',     startTime: 5,   endTime: 95  },
    { type: 'compilation', startTime: 100, endTime: 130 },
    { type: 'ending',      startTime: 140, endTime: 200 },
    { type: 'preview',     startTime: 200, endTime: 230 },
];

const FRAGMENT_SETTINGS = {
    autoSkipOpening:     false,
    autoSkipEnding:      false,
    autoSkipPreview:     false,
    autoSkipCompilation: false,
};

// ── State ────────────────────────────────────────────────────────────────────

let state = {
    src:            SOURCES['hls-big'],
    currentSeason:  undefined,
    currentEpisode: undefined,
    currentVoiceover: undefined,
};

// ── Helpers ──────────────────────────────────────────────────────────────────

function log(msg) {
    const p = document.createElement('p');
    p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logEl.prepend(p);
    if (logEl.children.length > 60) logEl.lastChild.remove();
}

function getSeasonEpisodes() {
    if (!player.seasons) return [];
    const season = player.seasons.find(s => s.value === state.currentSeason) || player.seasons[0];
    if (!season) return [];
    for (const ep of season.episodes ?? []) {
        const vo = ep.voiceovers?.find(v => v.value === state.currentVoiceover);
        if (vo?.episodes && vo.episodes.length > 0) return vo.episodes;
    }
    const filtered = (season.episodes ?? []).filter(ep =>
        !state.currentVoiceover || ep.voiceovers?.some(v => v.value === state.currentVoiceover)
    );
    return filtered.length > 0 ? filtered : (season.episodes ?? []);
}

function renderEpisodeButtons() {
    const el = document.getElementById('episode-btns');
    el.innerHTML = '';
    if (!player.seasons) { el.innerHTML = '<span style="color:#555;font-size:.78rem">нет сезонов</span>'; return; }
    getSeasonEpisodes().forEach(ep => {
        const btn = document.createElement('button');
        btn.textContent = ep.label;
        if (ep.value === state.currentEpisode) btn.classList.add('active');
        btn.onclick = () => {
            state.currentEpisode = ep.value;
            player.currentEpisode = ep.value;
            renderEpisodeButtons();
            renderVoiceoverButtons();
        };
        el.appendChild(btn);
    });
}

function renderVoiceoverButtons() {
    const el = document.getElementById('voiceover-btns');
    el.innerHTML = '';
    if (!player.seasons) { el.innerHTML = '<span style="color:#555;font-size:.78rem">нет сезонов</span>'; return; }
    const season  = player.seasons?.find(s => s.value === state.currentSeason) || player.seasons?.[0];
    const episode = season?.episodes?.find(e => e.value === state.currentEpisode) || season?.episodes?.[0];
    (episode?.voiceovers || []).forEach(vo => {
        const btn = document.createElement('button');
        const epCount = vo.episodes?.length;
        btn.textContent = vo.label + (epCount ? ` (${epCount} эп.)` : '');
        if (vo.value === state.currentVoiceover) btn.classList.add('active');
        btn.onclick = () => {
            state.currentVoiceover = vo.value;
            player.currentVoiceover = vo.value;
            const avail = getSeasonEpisodes();
            if (avail.length > 0 && !avail.some(e => e.value === state.currentEpisode)) {
                state.currentEpisode = avail[0].value;
                player.currentEpisode = state.currentEpisode;
            }
            renderEpisodeButtons();
            renderVoiceoverButtons();
        };
        el.appendChild(btn);
    });
}

// ── Actions ───────────────────────────────────────────────────────────────────

function setSrc(key) {
    state.src = SOURCES[key];
    player.src = state.src;
    document.getElementById('custom-src').value = '';
    log(`src → ${key}`);
}

function applyCustomSrc() {
    const url = document.getElementById('custom-src').value.trim();
    if (!url) return;
    state.src = url;
    player.src = url;
    log(`src → custom: ${url}`);
}

function setQualities(on) {
    player.qualities = on ? QUALITIES : undefined;
    log(`qualities → ${on ? QUALITIES.map(q => q.label).join(', ') : 'off'}`);
}

function setSeasons(on) {
    if (on) {
        state.currentSeason   = 's1';
        state.currentEpisode  = 's1e1';
        state.currentVoiceover = 'orig';
        player.seasons         = SEASONS;
        player.currentSeason   = state.currentSeason;
        player.currentEpisode  = state.currentEpisode;
        player.currentVoiceover = state.currentVoiceover;
    } else {
        state.currentSeason   = undefined;
        state.currentEpisode  = undefined;
        state.currentVoiceover = undefined;
        player.seasons         = undefined;
        player.currentSeason   = undefined;
        player.currentEpisode  = undefined;
        player.currentVoiceover = undefined;
    }
    renderEpisodeButtons();
    renderVoiceoverButtons();
    log(`seasons → ${on ? '2 сезона с voiceover-фильтрацией' : 'off'}`);
}

function setFragments(on) {
    player.fragments        = on ? FRAGMENTS : undefined;
    player.fragmentSettings = on ? FRAGMENT_SETTINGS : undefined;
    log(`fragments → ${on ? FRAGMENTS.map(f => f.type).join(', ') : 'off'}`);
}

function setPoster(on) {
    player.poster = on ? 'https://peach.blender.org/wp-content/uploads/bbb-splash.png' : undefined;
    log(`poster → ${on ? 'on' : 'off'}`);
}

function setSavedState(time) {
    player.savedState = time !== null ? { time } : null;
    log(`savedState → ${time !== null ? `${time}s` : 'null'}`);
}

function setLocale(locale) {
    player.locale = locale;
    log(`locale → ${locale}`);
}

// ── Events ────────────────────────────────────────────────────────────────────

player.addEventListener('seasonchange', e => {
    state.currentSeason = e.detail.value;
    player.currentSeason = state.currentSeason;
    renderEpisodeButtons();
    log(`seasonchange → ${e.detail.value}`);
});

player.addEventListener('episodechange', e => {
    state.currentEpisode = e.detail.value;
    player.currentEpisode = state.currentEpisode;
    renderEpisodeButtons();
    renderVoiceoverButtons();
    log(`episodechange → ${e.detail.value}`);
});

player.addEventListener('voiceoverchange', e => {
    state.currentVoiceover = e.detail.value;
    player.currentVoiceover = state.currentVoiceover;
    renderVoiceoverButtons();
    log(`voiceoverchange → ${e.detail.value}`);
});

player.addEventListener('savestate', e => {
    log(`savestate → time=${e.detail.state.time?.toFixed(1)}s`);
});

// ── Init ──────────────────────────────────────────────────────────────────────

player.src = state.src;
// ── Панель «Что играет сейчас» ───────────────────────────────────────────────
// Слева — что мы попросили сыграть, справа — что реально играет по данным
// media-элемента. Строка «сверка» зелёная, только когда они сходятся; это и
// есть доказательство, что переключение эпизода или озвучки сработало.

function mediaEl() { return player.querySelector('video'); }

function fmtClock(s) {
    if (!Number.isFinite(s) || s < 0) return '—';
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return `${m}:${String(sec).padStart(2, '0')}`;
}

/** Источник, который должен играть при текущем состоянии — та же логика, что у плеера. */
function expectedSrc() {
    if (!player.seasons) return state.src;
    const season = SEASONS.find(s => s.value === state.currentSeason);
    const ep = season?.episodes?.find(e => e.value === state.currentEpisode);
    if (!ep) return state.src;
    const vo = ep.voiceovers?.find(v => v.value === state.currentVoiceover);
    return vo?.src || ep.src || state.src;
}

function expectedEntry() {
    const src = expectedSrc();
    return Object.values(CATALOG).find(c => c.src === src) || null;
}

function updateProbe() {
    const el = document.getElementById('probe');
    if (!el) return;
    const v = mediaEl();
    if (!v) {
        el.innerHTML = '<div class="probe-row"><span>—</span><b>media-элемент не смонтирован</b></div>';
        return;
    }

    const texts   = Array.from(v.textTracks || []).filter(t => t.kind === 'subtitles' || t.kind === 'captions');
    const audio   = v.audioTracks ? Array.from(v.audioTracks) : null;
    const showing = texts.find(t => t.mode === 'showing');
    const cues    = showing && showing.cues ? showing.cues.length : 0;

    const want = expectedEntry();
    const haveDur = v.duration;

    // Вердикт строим на длительности: она уникальна почти у всех источников и,
    // в отличие от textTracks, не «залипает» от предыдущего источника — браузер
    // не всегда очищает список дорожек при смене src. Число субтитров показываем
    // рядом справочно: для пары BipBop 16×9 / 4×3 (обе 30:00) именно список
    // языков и показывает, какая из них играет.
    let verdict = '— нечего сверять';
    let ok = false;
    if (want && Number.isFinite(haveDur) && haveDur > 0) {
        ok = Math.abs(haveDur - want.dur) <= 3;
        verdict = ok ? '✓ длительность совпадает' : `✗ ждали ${fmtClock(want.dur)}, играет ${fmtClock(haveDur)}`;
    }

    const rows = {
        'ожидается':    want ? `${want.label} — ${fmtClock(want.dur)} · субтитров ${want.subs}` : 'вне каталога',
        'фактически':   `${fmtClock(haveDur)} · ${v.videoWidth ? v.videoWidth + '×' + v.videoHeight : '—'} · субтитров ${texts.length}`,
        'сверка':       verdict,
        'позиция':      fmtClock(v.currentTime),
        'дорожки субтитров': texts.length ? texts.map(t => t.language || t.label || '?').join(', ') : 'нет',
        'активные cue': showing ? `${showing.language || showing.label || '?'} · ${cues} шт.` : 'выключены',
        'аудиодорожки': audio
                            ? `${audio.length}: ${audio.map(t => t.language || t.label || '?').join(', ')}`
                            : 'audioTracks не поддерживается браузером',
    };

    el.innerHTML = Object.entries(rows).map(([k, val]) => {
        const cls = k === 'сверка' ? (ok ? 'ok' : 'bad') : '';
        return `<div class="probe-row"><span>${k}</span><b class="${cls}">${val}</b></div>`;
    }).join('');
}

setInterval(updateProbe, 500);
updateProbe();
</script>
</body>
</html>
