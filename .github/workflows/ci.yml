name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `tsc --noEmit` on the solution-style root config checks zero files:
      # it does not follow project references without `-b`.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:all
